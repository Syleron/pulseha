syntax = "proto3";

package rpc;

option go_package = "github.com/syleron/pulseha/rpc";

// Log Level Enum
enum LogLevel {
    DEBUG = 0;
    INFO = 1;
    WARNING = 2;
    ERROR = 3;
}

// CLI Service
// -----------------------------------------------------------------------------
// This service is primarily the daemon-local API that `pulsectl` calls on
// 127.0.0.1. It also contains a small number of RPCs that are invoked by
// other nodes during membership operations.
//
// Organization of methods below:
// - Membership (remote-target): called by other nodes to join/leave.
// - Daemon-local admin: used by the local CLI to manage the node/cluster.
// - Group management: CRUD and assignment for floating IP groups.
// - Orchestration (local-only): helpers that orchestrate multi-step flows
//   while keeping pulsectl connectivity local-only.
// - Quorum info: read-only inspection of voting sessions.
service CLI {
    // Membership (remote-target)
    rpc Join(JoinRequest) returns (JoinResponse) {}
    rpc Leave(LeaveRequest) returns (LeaveResponse) {}

    // Daemon-local admin
    rpc Status(StatusRequest) returns (StatusResponse) {}
    rpc Promote(PromoteRequest) returns (PromoteResponse) {}
    rpc SetMode(SetModeRequest) returns (SetModeResponse) {}
    // Config updates
    rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {}
    // Network resync
    rpc ResyncNetwork(ResyncNetworkRequest) returns (ResyncNetworkResponse) {}
    // Cluster lifecycle
    rpc CreateCluster(CreateClusterRequest) returns (CreateClusterResponse) {}
    // Token management
    rpc Token(TokenRequest) returns (TokenResponse) {}

    // Group management
    rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {}
    rpc AddIPToGroup(AddIPToGroupRequest) returns (AddIPToGroupResponse) {}
    rpc RemoveIPFromGroup(RemoveIPFromGroupRequest) returns (RemoveIPFromGroupResponse) {}
    rpc AssignGroupToNode(AssignGroupRequest) returns (AssignGroupResponse) {}
    rpc UnassignGroupFromNode(UnassignGroupRequest) returns (UnassignGroupResponse) {}
    rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {}
    rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {}

    // Orchestration (local-only)
    // Initiate a server-driven join against a target member
    rpc InitiateJoin(InitiateJoinRequest) returns (InitiateJoinResponse) {}

    // Config read
    rpc ReadConfig(ReadConfigRequest) returns (ReadConfigResponse) {}

    // Maintenance mode
    rpc SetMaintenance(SetMaintenanceRequest) returns (SetMaintenanceResponse) {}

    // Node capacity (max floating IPs a node may host)
    rpc SetCapacity(SetCapacityRequest) returns (SetCapacityResponse) {}

    // Quorum info (read-only)
    rpc GetVotingSessions(GetVotingSessionsRequest) returns (GetVotingSessionsResponse) {}
    rpc GetVotingSessionDetails(GetVotingSessionDetailsRequest) returns (GetVotingSessionDetailsResponse) {}
}

// Server Service
// -----------------------------------------------------------------------------
// Inter-node service used for state synchronization, quorum voting, and
// operational actions (IP bring up/down, health checks, removal, etc.).
service Server {
    rpc ConfigSync(ConfigSyncRequest) returns (ConfigSyncResponse) {}
    // Pull, not push: a node that has detected its own config diverged asks the
    // coordinator for the authoritative copy. See FetchConfigRequest.
    rpc FetchConfig(FetchConfigRequest) returns (FetchConfigResponse) {}
    rpc MakePassive(MakePassiveRequest) returns (MakePassiveResponse) {}
    rpc BringUpIP(UpIpRequest) returns (UpIpResponse) {}
    rpc BringDownIP(DownIpRequest) returns (DownIpResponse) {}
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}
    rpc Logs(LogsRequest) returns (LogsResponse) {}
    rpc Remove(RemoveRequest) returns (RemoveResponse) {}
    rpc CoordinateRemoval(CoordinateRemovalRequest) returns (CoordinateRemovalResponse) {}
    // Quorum voting methods
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse) {}
    rpc StartVotingSession(StartVotingSessionRequest) returns (StartVotingSessionResponse) {}
    rpc CastVote(CastVoteRequest) returns (CastVoteResponse) {}
    rpc GetVotingResult(GetVotingResultRequest) returns (GetVotingResultResponse) {}
    // Maintenance — forwarded from the initiating node so the target manages its own state
    rpc SetMaintenance(SetMaintenanceRequest) returns (SetMaintenanceResponse) {}
    // What the responder can see. Every member answers with its own Claim; the
    // cluster's Witness also reports each peer as obtained by a round-trip made
    // for this report. See WitnessReportResponse.
    rpc WitnessReport(WitnessReportRequest) returns (WitnessReportResponse) {}
}

// Join Request/Response
message JoinRequest {
    string hostname = 1;  // Node hostname (display/identifier only)
    string token = 2;    // Cluster join token
    string node_id = 3;  // Required node ID
    string bind_ip = 4;  // Optional local bind IP
    string bind_port = 5; // Optional local bind port
    // The joining node's public certificate, PEM encoded. Never a key.
    //
    // Carried with the request so the node is in the cluster's trust set the
    // moment it is in the cluster's config, rather than whenever its own publish
    // happens to propagate afterwards (#111, ADR-0005 step 3). Empty from a node
    // running a build that predates this, which is a node that publishes for
    // itself a moment later -- so the joinee records what it is given and does
    // not require it.
    string tls_cert = 6;
    // Joins as the cluster's Witness: a member that never serves and is never
    // counted. Fixed for the node's lifetime -- there is no RPC that changes it
    // afterwards (docs/adr/0006-a-witness-rules-on-overlapping-claims.md).
    bool witness = 7;
}

message JoinResponse {
    bool success = 1;
    string message = 2;
    string node_id = 3;
    bytes cluster_config = 4;  // Full cluster configuration for the joining node
}

// Leave Request/Response
message LeaveRequest {
    string node_id = 1;
}

message LeaveResponse {
    bool success = 1;
    string message = 2;
}

// Status Request/Response
message StatusRequest {}

message StatusResponse {
    repeated Member members = 1;
    repeated GroupInfo groups = 2;
    string mode = 3;
}

// Member status enum provides explicit values on the wire
enum MemberStatusEnum {
    MEMBER_STATUS_UNKNOWN = 0;
    MEMBER_STATUS_ACTIVE = 1;
    MEMBER_STATUS_PASSIVE = 2;
    reserved 3;
    reserved "MEMBER_STATUS_PARTIAL_ACTIVE";
    MEMBER_STATUS_MAINTENANCE = 4;
    // Healthy and eligible for promotion, holding no floating IPs. Derived at
    // the status boundary from the member's health plus its assignment list —
    // it is never stored, never sent between nodes, and never used to make a
    // placement decision. Reporting such a node as ACTIVE said nothing about
    // whether it was serving anything, which is what PARTIAL_ACTIVE (3, now
    // reserved) failed to fix by adding a stored value to this same enum.
    //
    // Reported in active-active clusters only, because that is the only mode
    // where every member's assignment list is current — peers self-report their
    // hosted addresses over ConfigSync there and nowhere else. In active-passive
    // an empty list is absence of knowledge rather than evidence of holding
    // nothing, so ACTIVE means "elected" and this value is never sent. A
    // consumer must still handle it in either mode: the mode is runtime
    // configuration, not a build-time fact.
    MEMBER_STATUS_STANDBY = 5;
    // A member that never serves and is never counted, reachable and answering.
    // Unlike STANDBY this one is stored and sent between nodes: it is the status
    // a Witness holds while it is up, so every check that accepts only ACTIVE or
    // PASSIVE leaves it out without having been told about it. A Witness that
    // stops answering reads UNKNOWN like any member; the role itself travels as
    // Member.witness, which is what a consumer reads to tell the two apart
    // (docs/adr/0006-a-witness-rules-on-overlapping-claims.md).
    MEMBER_STATUS_WITNESS = 6;
}

message Member {
    string hostname = 1;  // Node hostname (display only)
    MemberStatusEnum status = 2;
    repeated string active_ips = 3;
    string last_response = 4;
    string latency = 5;
    reserved 6;
    reserved "partial_active";
    string ip = 7;
    string port = 8;
    string node_id = 9;  // UUID of the node
    map<string, GroupAssignment> group_assignments = 10;  // Map of interface to group assignments
    // Whether this member is the cluster's Witness. Its role, not its status: it
    // stays true while the Witness is down and its status reads UNKNOWN, so a
    // consumer can keep an absent Witness from reading as a failed node.
    bool witness = 11;
}

// Promote Request/Response
message PromoteRequest {
    string node_id = 1;
    repeated string ips = 2;
    bool force_demote = 3;
}

message PromoteResponse {
    bool success = 1;
    string message = 2;
}

// ConfigSync Request/Response
message ConfigSyncRequest {
    bytes config = 1;
}

message ConfigSyncResponse {
    bool success = 1;
    string message = 2;
}

// FetchConfig Request/Response
//
// The repair half of config divergence detection. A node that has established it
// holds the minority view asks the coordinator for the authoritative copy.
//
// A pull rather than a push, for two reasons that are not symmetry. The decision
// to change a config stays with the node whose config changes, so nothing arrives
// unrequested and a peer that agrees with the coordinator is never touched. And the
// payload can be addressed to the asker -- see `repair_for` -- which is what lets
// it be exempt from the generation guard without that exemption being replayable
// at any other node.
//
// The pull direction is not what keeps a diverged coordinator from overwriting the
// cluster: a hash mismatch is symmetric, so "I disagree with the coordinator,
// therefore I adopt its copy" would obey a wrong coordinator exactly as a push
// would. The majority tally in Server.noteConfigDivergence is what does that.
message FetchConfigRequest {
    // Who is asking. Echoed back in the payload's `repair_for` key, which is what
    // lets the requester apply a config at its own generation: the exemption is
    // addressed to one node, so a stray copy cannot force it on anyone else.
    string requester_id = 1;
}

message FetchConfigResponse {
    bool success = 1;
    string message = 2;
    bytes config = 3;
}

// MakePassive Request/Response
message MakePassiveRequest {
    string node_id = 1;
    // Set when the demotion is the first step of explicitly promoting the node
    // named here. The demoted node then reports a handoff in progress until the target
    // turns Active or the handoff window lapses, so no election fills the gap.
    string handoff_to = 2;
}

message MakePassiveResponse {
    bool success = 1;
    string message = 2;
}

// IP Management Request/Response
message UpIpRequest {
    string iface = 1;
    repeated string ips = 2;
}

message UpIpResponse {
    bool success = 1;
    string message = 2;
    uint32 verification_version = 3; // 1: fresh post-operation interface inventory
    repeated string verified_ips = 4; // present on target iface (up), absent on node (down)
    repeated string failed_ips = 5; // unresolved or failed; partitions request with verified_ips
}

message DownIpRequest {
    string iface = 1;
    repeated string ips = 2;
}

message DownIpResponse {
    bool success = 1;
    string message = 2;
    uint32 verification_version = 3; // 1: fresh post-operation interface inventory
    repeated string verified_ips = 4; // present on target iface (up), absent on node (down)
    repeated string failed_ips = 5; // unresolved or failed; partitions request with verified_ips
}

// Health Check Request/Response
message HealthCheckRequest {
    string node_id = 1;      // Primary identifier (UUID)
    string cluster_token = 2; // Cluster membership token; if set, receiver validates it
}

message HealthCheckResponse {
    bool success = 1;
    string message = 2;
    string cluster_token = 3; // Receiver echoes its own token so caller can verify
    string node_id = 4; // Identity of the responding node
    MemberStatusEnum status = 5; // Its current role, not a role assigned by the caller
    string handoff_to = 6; // Node an explicit handoff this member is part of is moving the group to; empty when none
    // The version of the Witness protocol this daemon understands; 0 from a
    // build that predates it. A Witness may only join a cluster in which every
    // member reports at least 1, because an older binary would count the
    // Witness as a third node and switch off the two-node path (ADR-0002).
    int32 witness_protocol_version = 7;
}

// Logs Request/Response
message LogsRequest {
    int32 lines = 1;
    LogLevel level = 2;
    string message = 3;
    string node_id = 4;
}

message LogsResponse {
    repeated string logs = 1;
}

// Remove Request/Response
message RemoveRequest {
    string node_id = 1;
}

message RemoveResponse {
    bool success = 1;
    string message = 2;
}

// CoordinateRemoval Request/Response
// Used when a node wants to leave the cluster in a deterministic way.
// The coordinator ensures all cluster members remove the node before responding.
message CoordinateRemovalRequest {
    string node_id = 1;  // The node ID requesting to leave
}

message CoordinateRemovalResponse {
    bool success = 1;
    string message = 2;
    int32 updated_nodes = 3;  // Number of nodes successfully updated
    repeated string failed_nodes = 4;  // Node IDs that failed to update
}

// Mode Management Request/Response
message SetModeRequest {
    string mode = 1;  // active-passive or active-active
}

message SetModeResponse {
    bool success = 1;
    string message = 2;
}

// Config Update Request/Response
message UpdateConfigRequest {
    string key = 1;    // e.g., "logging_level" or nested via json tag
    string value = 2;  // string representation; server handles type conversion
}

message UpdateConfigResponse {
    bool success = 1;
    string message = 2;
}

// Maintenance Mode Request/Response
message SetMaintenanceRequest {
    bool enable = 1;   // true = enter maintenance, false = exit maintenance
    string node_id = 2; // optional: target node UUID; defaults to local node if empty
}

message SetMaintenanceResponse {
    bool success = 1;
    string message = 2;
}

// Node Capacity Request/Response
message SetCapacityRequest {
    string node_id = 1; // optional: target node UUID; defaults to local node if empty
    int32 capacity = 2; // max floating IPs the node may host; 0 = unlimited
}

message SetCapacityResponse {
    bool success = 1;
    string message = 2;
}

// Read Config Request/Response
message ReadConfigRequest {}

message ReadConfigResponse {
    bool success = 1;
    string message = 2;
    bytes config = 3;  // Full config serialized as JSON
}

// Resync Network
message ResyncNetworkRequest {
    bool create_default_groups = 1; // if true, create default groups for new interfaces
}

message ResyncNetworkResponse {
    bool success = 1;
    string message = 2;
}

// New message types for configuration management

// Group Management
message CreateGroupRequest {
    string name = 1;
}

message CreateGroupResponse {
    bool success = 1;
    string message = 2;
}

message AddIPToGroupRequest {
    string group_name = 1;
    string ip = 2;
}

message AddIPToGroupResponse {
    bool success = 1;
    string message = 2;
    repeated string warnings = 3;
}

message RemoveIPFromGroupRequest {
    string group_name = 1;
    string ip = 2;
}

message RemoveIPFromGroupResponse {
    bool success = 1;
    string message = 2;
    repeated string warnings = 3;
}

message AssignGroupRequest {
    string group_name = 1;
    string node_id = 2;   // canonical target identifier (UUID)
    string interface = 3;
}

message AssignGroupResponse {
    bool success = 1;
    string message = 2;
}

message ListGroupsRequest {
    bool json_output = 1;
}

message GroupInfo {
    string name = 1;
    repeated string ips = 2;
    repeated GroupAssignment assignments = 3;
}

message GroupAssignment {
    string interface = 1;
    string node_id = 2;
}

message ListGroupsResponse {
    bool success = 1;
    string message = 2;
    repeated GroupInfo groups = 3;
    string json_data = 4;  // For raw JSON output
}

// Group Unassignment
message UnassignGroupRequest {
    string group_name = 1;
    string interface = 2;
    string node_id = 3;
}

message UnassignGroupResponse {
    bool success = 1;
    string message = 2;
    // Warnings carries what the release of the group's addresses could not
    // confirm. Unassigning succeeds regardless -- the group stays configured, so
    // its addresses stay accounted for -- but the operator should know whether
    // convergence was this call's or is now the enforce pass's.
    repeated string warnings = 3;
}

// Group Deletion
message DeleteGroupRequest {
    string group_name = 1;
    bool force = 2;  // Force deletion even if assigned to nodes
}

message DeleteGroupResponse {
    bool success = 1;
    string message = 2;
    repeated string warnings = 3;
}

// Cluster Management
message CreateClusterRequest {
    string bind_ip = 1;
    string bind_port = 2;
    string mode = 3;  // active-passive or active-active
    string node_id = 4; // optional: custom node ID for first node
}

message CreateClusterResponse {
    bool success = 1;
    string message = 2;
    string token = 3;  // Add token field for cluster join token
    string node_id = 4;  // Generated node ID for the first node
}

// Quorum Voting Types
enum VoteType {
    NODE_STATUS = 0;
    IP_REDISTRIBUTION = 1;
    CONFIG_CHANGE = 2;
}

enum VoteDecision {
    YES = 0;
    NO = 1;
    ABSTAIN = 2;
}

// Quorum Voting Messages
message StartVotingSessionRequest {
    VoteType type = 1;
    string subject = 2;
    string description = 3;
    int64 timeout_seconds = 4;
}

message StartVotingSessionResponse {
    bool success = 1;
    string message = 2;
    string session_id = 3;
}

message CastVoteRequest {
    string session_id = 1;
    string voter_id = 2;
    VoteDecision decision = 3;
}

message CastVoteResponse {
    bool success = 1;
    string message = 2;
}

message GetVotingResultRequest {
    string session_id = 1;
}

message VotingSessionResult {
    bool passed = 1;
    int32 yes_count = 2;
    int32 no_count = 3;
    int32 total_votes = 4;
    bool quorum_met = 5;
    int64 completed_at = 6; // Unix timestamp
}

message GetVotingResultResponse {
    bool success = 1;
    string message = 2;
    VotingSessionResult result = 3;
}

message GetVotingSessionsRequest {
    bool include_completed = 1;
}

message VotingSessionInfo {
    string id = 1;
    VoteType type = 2;
    string subject = 3;
    string description = 4;
    int64 start_time = 5; // Unix timestamp
    int64 end_time = 6; // Unix timestamp
    bool completed = 7;
    VotingSessionResult result = 8;
}

message GetVotingSessionsResponse {
    bool success = 1;
    string message = 2;
    repeated VotingSessionInfo sessions = 3;
}

message GetVotingSessionDetailsRequest {
    string session_id = 1;
}

message Vote {
    string voter_id = 1;
    VoteDecision decision = 2;
    int64 timestamp = 3; // Unix timestamp
}

message GetVotingSessionDetailsResponse {
    bool success = 1;
    string message = 2;
    VotingSessionInfo session = 3;
    repeated Vote votes = 4;
}

// Token Management Request/Response
message TokenRequest {
    bool regenerate = 1; // If true, generate a new token; if false, return current token
}

message TokenResponse {
    bool success = 1;
    string message = 2;
    string token = 3; // The cluster join token
} 

// Server-driven join
message InitiateJoinRequest {
    string target_host = 1;
    string target_port = 2;
    string token = 3;
    string bind_ip = 4;
    string bind_port = 5;
    string node_id = 6;
    bool witness = 7; // Join as the cluster's Witness; see JoinRequest.witness
}

message InitiateJoinResponse {
    bool success = 1;
    string message = 2;
}
// Explicit peer decision. Older servers return Unimplemented and cannot vote.
message RequestVoteRequest {
    string session_id = 1;
    string initiator_id = 2;
    string vote_type = 3;
    string subject = 4;
    string description = 5;
    repeated string member_ids = 6;
    int64 epoch = 7;
    int64 expires_at_unix_milli = 8;
    string cluster_token = 9;
    // v2: prepare promises a ballot; accept records the recovered proposal.
    string phase = 10;
    uint64 ballot = 11;
}
message RequestVoteResponse {
    string session_id = 1;
    string voter_id = 2;
    int64 epoch = 3;
    bool granted = 4;
    string reason = 5;
    uint32 protocol_version = 6;
    string phase = 7;
    uint64 ballot = 8;
    uint64 promised_ballot = 9;
    string promised_by = 10;
    uint64 accepted_ballot = 11;
    string accepted_by = 12;
    string accepted_subject = 13;
}

// Witness Report
// -----------------------------------------------------------------------------
// docs/adr/0006-a-witness-rules-on-overlapping-claims.md. A node that cannot see
// its peer asks the Witness what it can see; the Witness asks the peer, there and
// then, and reports the answer or that none came. Nothing in a report is a
// recollection: a peer is visible only if it answered a round-trip made for the
// report that names it, and a TCP connect is never an answer.

// What a member asserts about itself, as of the Cluster Epoch it was formed in.
message MemberClaim {
    string node_id = 1;
    MemberStatusEnum status = 2;
    repeated string active_ips = 3;
    int64 cluster_epoch = 4;
    // The member this one believes is the Elected Node, as of cluster_epoch.
    string elected_node = 5;
}

message WitnessReportRequest {
    string node_id = 1;        // the asker
    string cluster_token = 2;
    // The asker's own Claim. Carried rather than fetched, so the Witness never
    // calls back into a node that is waiting on its answer.
    MemberClaim claim = 3;
}

message PeerView {
    string node_id = 1;
    // True only when the peer answered, under its own identity, a round-trip
    // made for this report and inside its deadline.
    bool visible = 2;
    MemberClaim claim = 3;     // set if and only if visible
    string reason = 4;         // why not visible; for logs, not for decisions
}

message WitnessReportResponse {
    bool success = 1;
    string message = 2;
    MemberClaim self = 3;      // the responder's own Claim
    // The responder is the cluster's Witness. peers is filled only when it is.
    bool from_witness = 4;
    // Every configured member other than the responder and the asker.
    repeated PeerView peers = 5;
    int32 witness_protocol_version = 6;
    // The Witness's decisions on addresses that more than one member claims
    // right now, judged from the asker's own Claim and the visible peers'. Empty
    // when nothing overlaps, and always empty from a member that is not the
    // Witness.
    repeated Ruling rulings = 7;
}

// Who keeps an overlapping claim. The keeper is the member the Witness last saw
// holding it without contest -- the one the network has already learned -- and
// the lowest node ID only when the Witness has no such observation.
message Ruling {
    string keeper = 1;
    // The members whose Claims overlapped. Every contender but the keeper is
    // ruled against and gives the addresses up.
    repeated string contenders = 2;
    // The addresses ruled on. Empty means every address the contenders hold,
    // which is the active-passive case: there the conflict is two Active Claims,
    // and an Active node's address list is not knowledge (ADR-0001).
    repeated string addresses = 3;
    // Issued for an earlier report and no longer contested -- the loser has
    // already let go. Carried so that a keeper that did not see the contest
    // still re-announces what it kept. Nobody stands down on a settled Ruling.
    bool settled = 4;
}
