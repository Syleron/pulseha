name: dev
on:
  push:
    branches:
      - '**'
      - '!master'
  pull_request:

permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
      id: go

    - name: Install protoc (protobuf compiler)
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version

    - name: Install protoc Go plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Dependencies
      run: make get

    # Must follow Build: rpc/*.pb.go is generated by `make protos` and is not
    # committed, so the rpc package has no Go files on a fresh checkout.
    - name: Build
      run: make

    - name: Test
      run: make test

    # Separate from `make test`: the config reload fix and the ConfigSync
    # ordering tests only fail under -race, so a green `make test` says nothing
    # about them.
    - name: Test (race detector)
      run: make testrace

    # tests/ is a separate tree from internal/, cmd/ and packages/, so neither
    # target above touches it and the TestCluster/TestNode harness was going
    # unbuilt in CI. Integration tests skip themselves off Linux; the runner is
    # Linux, so these actually execute here.
    - name: Integration tests
      run: make quiet-integration-test

    # The ordinary integration fixture shares a namespace and has no NET_ADMIN.
    # Verify actual address effects separately, on disposable links in a container.
    - name: Verified IP transfers (isolated kernel)
      run: |
        CGO_ENABLED=0 go test -c -o /tmp/pulseha-kernel.test ./internal/server
        docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW \
          -e PULSEHA_TRANSFER_KERNEL_TEST=1 \
          -v /tmp/pulseha-kernel.test:/transfer.test:ro \
          alpine:latest sh -ec 'apk add --no-cache iputils-arping; /transfer.test -test.run "^TestIPTransferKernel$" -test.v -test.timeout 90s'
